{% extends "base/base.html" %}

{% block title %}
    Update bank
{% endblock %}

{% block content %}
<h2>Update bank</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ bank.name }}" required>
    </div>
    <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" name="address" value="{{ bank.address }}" required>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="status" name="status" {% if bank.status %}checked{% endif %}>
        <label class="form-check-label" for="status">Active status</label>
    </div>
    <button type="submit" class="btn btn-warning">Update</button>
    <a href="{% url 'core:list_bank' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
