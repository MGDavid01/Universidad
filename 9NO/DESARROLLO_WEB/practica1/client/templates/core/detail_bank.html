{% extends "base/base.html" %}

{% block title %}
    Bank detail
{% endblock %}

{% block content %}
<h2>Bank detail</h2>
<table class="table">
    <tr>
        <th>ID</th>
        <td>{{ bank.id }}</td>
    </tr>
    <tr>
        <th>Name</th>
        <td>{{ bank.name }}</td>
    </tr>
    <tr>
        <th>Address</th>
        <td>{{ bank.address }}</td>
    </tr>
    <tr>
        <th>Status</th>
        <td>{{ bank.status }}</td>
    </tr>
    <tr>
        <th>Timestamp</th>
        <td>{{ bank.timestamp }}</td>
    </tr>
    <tr>
        <th>Update</th>
        <td>{{ bank.update }}</td>
    </tr>
</table>
<a href="{% url 'core:list_bank' %}" class="btn btn-secondary">Back</a>
<a href="{% url 'core:update_bank' bank.id %}" class="btn btn-warning">Edit</a>
{% endblock %}
