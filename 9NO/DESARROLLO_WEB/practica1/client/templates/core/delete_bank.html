{% extends "base/base.html" %}

{% block title %}
    Delete bank
{% endblock %}

{% block content %}
<h2>Delete bank</h2>
<p>Are you sure you want to delete the bank {{ bank.name }}(ID {{ bank.id }})?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'core:list_bank' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
