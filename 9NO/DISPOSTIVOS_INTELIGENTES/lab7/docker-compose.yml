services:
  minio:
    image: chainguard/minio:latest
    container_name: minio_storage
    user: "65532:65532"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola Web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: passwordseguro123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped